spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

sendgrid:
  api-key: ${SENDGRID_API_KEY}
  remetente-email: ${SENDGRID_REMETENTE_EMAIL}
  remetente-nome: ${SENDGRID_REMETENTE_NOME:Tais & Gabriel}


app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  admin:
    username: ${ADMIN_USERNAME}
    password-hash: ${ADMIN_PASSWORD_HASH}
  email:
    noivos: ${EMAIL_NOIVOS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

mercadopago:
  access-token-pix: ${MP_ACCESS_TOKEN_PIX}
  access-token-cartao: ${MP_ACCESS_TOKEN_CARTAO}
  success-url: ${MP_SUCCESS_URL}
  failure-url: ${MP_FAILURE_URL}
  pending-url: ${MP_PENDING_URL}

server:
  port: ${PORT:8080}

logging:
  level:
    br.com.casamento: INFO
    org.springframework.web: INFO